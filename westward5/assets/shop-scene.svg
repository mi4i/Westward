  <g fill="#11161b" stroke="#41474f" stroke-width="3"><rect x="632" y="158" width="36" height="570" rx="8"/><rect x="1400" y="155" width="38" height="573" rx="8"/></g>
  <g fill="#ef2430"><rect x="635" y="220" width="30" height="90" rx="5" opacity=".7"/><rect x="1404" y="240" width="30" height="70" rx="5" opacity=".55"/></g>

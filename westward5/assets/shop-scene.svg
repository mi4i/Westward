  <path d="M0 710L1600 660v240H0z" fill="#090b0d"/>
  <path d="M600 710l360-15 210 205H760z" fill="#a5101b" opacity=".1"/>
  <g stroke="#8c949b" stroke-opacity=".12"><path d="M0 770h1600"/><path d="M0 835h1600"/><path d="M500 690l-80 210"/><path d="M980 670l120 230"/></g>

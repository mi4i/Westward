    <path d="M307 67l-70 85h179V68zM440 68v84h160l-65-69c-27-8-59-13-95-15z" fill="#2c343b" opacity=".82"/>
    <ellipse cx="188" cy="258" rx="76" ry="76" fill="#090b0d"/><ellipse cx="188" cy="258" rx="48" ry="48" fill="#30363d"/><ellipse cx="650" cy="258" rx="76" ry="76" fill="#090b0d"/><ellipse cx="650" cy="258" rx="48" ry="48" fill="#30363d"/>
    <path d="M714 187h80v30h-88z" fill="#ff3945" opacity=".9"/><path d="M64 192h88l-10 30H52z" fill="#e7edf1" opacity=".9"/>
    <path d="M320 195h260" stroke="#ff626b" stroke-opacity=".5" stroke-width="3"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1015"/><stop offset=".55" stop-color="#22272d"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
    <linearGradient id="car" x1="0" x2="1"><stop stop-color="#4e070e"/><stop offset=".45" stop-color="#c41421"/><stop offset="1" stop-color="#350409"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff2a36" stop-opacity=".42"/><stop offset="1" stop-color="#ff2a36" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Shop ceiling and beams -->
  <g opacity=".28" fill="#cbd3da">
    <rect x="0" y="85" width="1600" height="13"/><rect x="160" y="0" width="17" height="640"/><rect x="1330" y="0" width="20" height="660"/>
    <rect x="860" y="0" width="14" height="560"/><rect x="0" y="340" width="1600" height="7"/>
  </g>
  <g opacity=".52" fill="#e8edf1"><rect x="360" y="98" width="360" height="15" rx="7"/><rect x="970" y="98" width="300" height="15" rx="7"/></g>
  <!-- Tool wall / shop silhouettes -->
  <rect x="1030" y="200" width="420" height="360" rx="16" fill="#13181d" stroke="#333941"/>
  <g fill="#252b31"><rect x="1070" y="245" width="125" height="180" rx="8"/><rect x="1215" y="245" width="190" height="70" rx="8"/><rect x="1215" y="335" width="190" height="90" rx="8"/></g>

name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTING_SSH_PRIVATE_KEY }}

      - name: Add hosting server to known hosts
        run: ssh-keyscan -p 22 31.131.18.219 >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'AGENTS.md' \
            ./ pandossh@31.131.18.219:/home2/pandossh/canada.pandos.shop/